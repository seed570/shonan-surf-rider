<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#087bb8">
<title>Shonan Surf Rider</title>
<style>
:root{--navy:#07345b;--blue:#087bb8;--foam:#e8fbff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#087bb8;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:white;touch-action:none}
#game{position:relative;width:100%;height:100%;min-height:100dvh;background:linear-gradient(#74d5ff 0%,#b7edff 25%,#168fc8 48%,#006da7 100%);overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;text-shadow:0 2px 5px #00304f99}
.pill{background:#07345bcc;border:1px solid #ffffff66;border-radius:14px;padding:8px 12px;backdrop-filter:blur(6px);font-weight:800;box-shadow:0 4px 14px #00304f22}
.score-label{font-size:11px;letter-spacing:.12em;opacity:.85}.score-num{font-size:26px;line-height:1.1}.small{font-size:12px;margin-top:4px}
#status{position:absolute;top:25%;left:50%;transform:translate(-50%,-50%);text-align:center;width:90%;pointer-events:none;text-shadow:0 3px 10px #00304f88}
#status h1{font-size:clamp(27px,7vw,42px);line-height:1.1;margin:0 0 8px;font-weight:950;letter-spacing:.02em}
#status p{margin:0;font-weight:700;font-size:14px}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#003b5c35;backdrop-filter:blur(2px);padding:24px}
.panel{width:min(420px,100%);background:#f7fdffed;color:var(--navy);border:1px solid white;border-radius:24px;padding:24px 20px;text-align:center;box-shadow:0 20px 60px #00304f55}
.panel .wave{font-size:48px}.panel h2{font-size:28px;margin:2px 0 8px}.panel p{font-size:14px;line-height:1.65;margin:8px 0 18px}
button{font:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.primary{background:linear-gradient(135deg,#087bb8,#0752a0);color:white;border-radius:14px;padding:14px 22px;font-size:17px;font-weight:850;width:100%;box-shadow:0 5px 0 #063e77}
.controls{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.pad,.actions{display:flex;gap:10px;pointer-events:auto}
.actions{flex-direction:column}
.ctrl{width:62px;height:62px;border-radius:50%;background:#07345b88;border:2px solid #ffffffc9;color:white;font-size:25px;font-weight:900;box-shadow:0 4px 0 #003c5b55;display:flex;align-items:center;justify-content:center;user-select:none}
.ctrl:active,.ctrl.active{background:#fff;color:#075b91;transform:translateY(2px)}
.ctrl small{font-size:10px;display:block;line-height:1;margin-top:1px}
.ctrl.action{width:58px;height:58px;font-size:23px}
#toast{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);font-size:25px;font-weight:950;text-align:center;text-shadow:0 3px 12px #00304f;opacity:0;pointer-events:none}
#footer{position:absolute;bottom:max(5px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:10px;color:#fff9;text-shadow:0 1px 4px #00304f;pointer-events:none}
@media(min-width:700px){.ctrl{width:70px;height:70px}.ctrl.action{width:64px;height:64px}.panel{padding:28px}.controls{left:30px;right:30px;bottom:24px}}
</style>
</head>
<body>
<div id="game">
<canvas id="c"></canvas>
<div class="hud">
  <div class="pill"><div class="score-label">SCORE</div><div class="score-num" id="score">0</div><div class="small">BEST <span id="best">0</span></div></div>
  <div class="pill" style="text-align:right"><div class="score-label">WAVE <span id="wave">1</span>/3</div><div style="font-size:20px" id="timer">01:00</div><div class="small" id="combo">COMBO ×1</div></div>
</div>
<div id="status"><h1>RIDE THE WAVE</h1><p>波をつかまえて、長く乗ろう。</p></div>
<div id="toast"></div>
<div class="controls">
  <div class="pad">
    <button class="ctrl" data-key="left" aria-label="左">‹</button>
    <button class="ctrl" data-key="right" aria-label="右">›</button>
  </div>
  <div class="actions">
    <button class="ctrl action" data-key="jump" aria-label="ジャンプ">↑<small>JUMP</small></button>
    <button class="ctrl action" data-key="trick" aria-label="トリック">〰<small>TRICK</small></button>
  </div>
</div>
<div id="footer">横移動：左右ボタン / ジャンプ：↑ / トリック：〰　　PCは ← → / Space / X</div>
<div id="overlay">
  <div class="panel">
    <div class="wave">🌊</div>
    <h2>Shonan Surf Rider</h2>
    <p>湘南の波に乗ってハイスコアを目指そう！<br>左右に動いて波をキープ。ジャンプ中にトリックを決めると高得点。</p>
    <button class="primary" id="start">SURF START</button>
    <p style="font-size:11px;color:#4f7087;margin:14px 0 0">スマホは画面のボタン、PCはキーボードで操作できます。</p>
  </div>
</div>
</div>
<script>
(()=>{
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
let W=0,H=0,dpr=1,last=0,running=false,ended=false,time=60,score=0,best=0,playerX=.5,lean=0,jump=0,jumpV=0,combo=1,ride=0,foam=0,particles=[],hazards=[],keys={left:false,right:false};
try{best=+(localStorage.getItem('ssrBest')||0)}catch(e){}
$('best').textContent=best.toLocaleString();
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function rand(a,b){return a+Math.random()*(b-a)}
function poly(points,fill){ctx.fillStyle=fill;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill()}
function line(points,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke()}
function drawBackground(t){
 const sky=ctx.createLinearGradient(0,0,0,H*.52);sky.addColorStop(0,'#68d0ff');sky.addColorStop(1,'#e0f8ff');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 // sun and clouds
 ctx.fillStyle='#fff7c4';ctx.beginPath();ctx.arc(W*.78,H*.12,Math.min(W,H)*.045,0,Math.PI*2);ctx.fill();
 for(let i=0;i<4;i++){let x=((i*W*.34+t*.008)%(W+180))-70,y=H*(.09+(i%3)*.065);ctx.fillStyle='#ffffff9c';ctx.beginPath();ctx.ellipse(x,y,34,10,0,0,7);ctx.ellipse(x+20,y-5,23,12,0,0,7);ctx.fill()}
 // distant Shonan silhouette
 poly([[0,H*.38],[W*.10,H*.34],[W*.18,H*.36],[W*.28,H*.29],[W*.36,H*.35],[W*.48,H*.32],[W*.57,H*.37],[W*.7,H*.34],[W*.83,H*.38],[W,H*.35],[W,H*.53],[0,H*.53]],'#6cafa7');
 poly([[0,H*.41],[W*.14,H*.38],[W*.25,H*.40],[W*.38,H*.35],[W*.53,H*.4],[W*.68,H*.37],[W*.82,H*.41],[W,H*.39],[W,H*.52],[0,H*.52]],'#b7d8bb');
 // ocean
 const sea=ctx.createLinearGradient(0,H*.4,0,H);sea.addColorStop(0,'#25c6e5');sea.addColorStop(.32,'#078fc5');sea.addColorStop(1,'#005187');ctx.fillStyle=sea;ctx.fillRect(0,H*.42,W,H*.58);
 // perspective streaks
 for(let i=0;i<15;i++){let y=H*.44+((i*37+t*(.025+i*.001))%(H*.62));let span=(y/H)*W*.8;let x=(Math.sin(i*12.7+t*.001)*.5+.5)*(W-span);ctx.globalAlpha=.08+(i%3)*.035;line([[x,y],[x+span*.25,y-2],[x+span*.5,y+1]],'#e4ffff',1+(y/H)*2)}
 ctx.globalAlpha=1;
 // curling wave face on right, wave rolls across screen
 let phase=(t*.00012)%1, crestX=W*(.78-phase*.7), base=H*.69;
 poly([[crestX-W*.42,H*.48],[crestX-W*.2,H*.46],[crestX,H*.49],[crestX+W*.13,H*.56],[crestX+W*.23,H*.7],[W,H*.83],[W,H],[0,H],[0,H*.7]],'#087db2');
 // wave dark hollow
 ctx.fillStyle='#00649c';ctx.beginPath();ctx.ellipse(crestX+W*.02,H*.66,W*.22,H*.15,-.12,Math.PI,Math.PI*2);ctx.fill();
 // crest curve and foam
 line([[crestX-W*.42,H*.49],[crestX-W*.24,H*.46],[crestX-W*.1,H*.47],[crestX,H*.51],[crestX+W*.08,H*.57],[crestX+W*.13,H*.65]],'#d7ffff',Math.max(4,W*.012));
 for(let i=0;i<40;i++){let x=crestX-W*.4+((i*19+t*.02)%(W*.55));let y=H*.49+Math.sin(i*1.7+t*.002)*H*.018+(x-crestX)*.14;ctx.globalAlpha=randAlpha(i);ctx.fillStyle='#f2ffff';ctx.beginPath();ctx.ellipse(x,y,rand(2,8),rand(1,3),-.3,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
 // foreground foam trails
 for(let i=0;i<18;i++){let x=((i*W*.083+t*.06)%(W+60))-30;let y=H*.73+((i%6)*H*.045)+Math.sin(t*.002+i)*8;line([[x,y],[x+W*.035,y-4],[x+W*.06,y+2]],'#c7fbff88',1.5+(i%3))}
}
function randAlpha(i){return .35+(Math.sin(i*8.1)+1)*.25}
function drawBoard(x,y,scale,air=false){
 ctx.save();ctx.translate(x,y);ctx.rotate(lean*.08);ctx.scale(scale,scale);
 if(air){ctx.shadowColor='#002d4b55';ctx.shadowBlur=14;ctx.shadowOffsetY=12}
 // board
 poly([[-7,-40],[-13,-16],[-12,24],[-5,39],[3,38],[12,17],[11,-19],[5,-40],[0,-44]],'#fff8df');
 line([[0,-35],[0,30]],'#5fc5d8',2);poly([[-5,10],[0,21],[5,10]],'#ef875a');
 // surfer legs
 line([[-4,-5],[-13,7],[-4,14]],'#172e40',6);line([[5,-5],[12,6],[6,13]],'#172e40',6);
 // body
 line([[0,-19],[-2,-6],[2,2]],'#f0b88a',5);poly([[-7,-24],[5,-25],[9,-13],[2,-7],[-7,-11]],'#102c40');
 // arms
 line([[-5,-20],[-17,-13],[-21,-6]],'#d99d74',4);line([[5,-20],[17,-15],[21,-7]],'#d99d74',4);
 // head
 ctx.fillStyle='#a86f4c';ctx.beginPath();ctx.arc(0,-29,5.5,0,Math.PI*2);ctx.fill();
 // hair
 ctx.fillStyle='#172b35';ctx.beginPath();ctx.arc(-1,-31,5.5,Math.PI,Math.PI*2);ctx.fill();
 ctx.restore();
}
function drawPlayer(){
 const x=W*(.5+playerX*.34),ground=H*.73+(Math.sin(ride*.06)*H*.012),air=jump>0;
 if(air){for(let i=0;i<5;i++){ctx.globalAlpha=.22-i*.035;line([[x-15-i*5,ground+15+i*4],[x+14+i*7,ground+21+i*4]],'#e7ffff',2)}ctx.globalAlpha=1}
 drawBoard(x,ground-(air?jump*H*.20:0),Math.max(.7,Math.min(1.25,W/390)),air);
}
function pop(text){$('toast').textContent=text;$('toast').style.transition='none';$('toast').style.opacity=1;$('toast').style.transform='translate(-50%,-50%) scale(1.1)';setTimeout(()=>{$('toast').style.transition='opacity .6s,transform .6s';$('toast').style.opacity=0;$('toast').style.transform='translate(-50%,-70%) scale(.9)'},650)}
function update(dt){
 if(!running)return;
 time-=dt/1000;if(time<=0){time=0;finish();return}
 ride+=dt;foam+=dt;
 if(keys.left){playerX-=dt*.00042;lean=-1}else if(keys.right){playerX+=dt*.00042;lean=1}else lean*=.92;
 playerX=Math.max(-1,Math.min(1,playerX));
 if(jump>0){jump+=jumpV*dt/16;jumpV-=.0011*dt;if(jump<=0){jump=0;jumpV=0;if(combo>1){score+=Math.round(150*combo);pop('LANDING +'+Math.round(150*combo))}combo=1}}
 score+=Math.round(dt*.018*(1+Math.max(0,1-Math.abs(playerX)))); 
 $('score').textContent=score.toLocaleString();$('timer').textContent='00:'+String(Math.ceil(time)).padStart(2,'0');$('wave').textContent=String(Math.min(3,1+Math.floor((60-time)/20)));$('combo').textContent='COMBO ×'+combo;
}
function frame(now){let dt=Math.min(40,now-last||16);last=now;drawBackground(now);if(running){update(dt);drawPlayer()}else drawPlayer();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
function start(){score=0;time=60;playerX=0;jump=0;combo=1;ride=0;running=true;ended=false;$('overlay').style.display='none';$('status').style.display='none';$('score').textContent='0';$('wave').textContent='1';$('timer').textContent='01:00';$('combo').textContent='COMBO ×1';pop('GO SURF!')}
function finish(){running=false;ended=true;if(score>best){best=score;try{localStorage.setItem('ssrBest',best)}catch(e){}$('best').textContent=best.toLocaleString()}$('overlay').style.display='flex';$('overlay').innerHTML=`<div class="panel"><div class="wave">🏄</div><h2>RIDE COMPLETE!</h2><p>今回のスコア<br><strong style="font-size:34px">${score.toLocaleString()}</strong><br>BEST ${best.toLocaleString()}<br><br>${score>1500?'ナイスライド！波をつかめてきた。':'波はまだまだある。もう一度チャレンジ！'}</p><button class="primary" id="again">もう一度乗る</button></div>`;$('again').addEventListener('click',start)}
$('start').addEventListener('click',start);
const press=(key,on)=>{if(key==='left'||key==='right')keys[key]=on;if(key==='jump'&&on&&running&&jump===0){jump=1;jumpV=.075;pop('JUMP!')}if(key==='trick'&&on&&running){if(jump>0){combo=Math.min(5,combo+1);score+=250*combo;pop('TRICK ×'+combo+'  +'+250*combo)}else{score+=25;pop('POP-UP +25')}}};
document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;const down=e=>{e.preventDefault();b.classList.add('active');press(k,true)},up=e=>{e.preventDefault();b.classList.remove('active');press(k,false)};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',e=>{if(e.buttons)up(e)})});
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','x','X'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft')press('left',true);if(e.key==='ArrowRight')press('right',true);if(e.key===' '&&!e.repeat)press('jump',true);if((e.key==='x'||e.key==='X')&&!e.repeat)press('trick',true);if(e.key==='Enter'&&!running)start()});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')press('left',false);if(e.key==='ArrowRight')press('right',false)});
})();
</script>
</body>
</html>

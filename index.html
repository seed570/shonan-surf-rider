<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#071b2b">
<title>SHONAN SURF RIDER — Line & Flow</title>
<style>
:root{--ink:#eef9ff;--muted:#a7c5d7;--glass:rgba(5,22,37,.68);--line:rgba(221,245,255,.22);--lime:#d6ff70;--coral:#ff947d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061827;color:var(--ink);font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:manipulation}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.overlay{position:fixed;inset:0;pointer-events:none}
.topbar{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:14px 14px 0;gap:10px}
.brand{font-size:11px;font-weight:900;letter-spacing:.19em;color:#d7f5ff;text-shadow:0 2px 14px #001421}
.brand span{display:block;font-size:9px;letter-spacing:.12em;color:#8bb3c8;font-weight:700;margin-top:3px}
.stats{display:flex;gap:7px}
.stat{min-width:67px;padding:8px 10px;border:1px solid var(--line);border-radius:13px;background:var(--glass);backdrop-filter:blur(12px);text-align:right}
.stat small{display:block;color:#9bbccc;font-size:9px;letter-spacing:.12em;font-weight:800}
.stat strong{font-size:18px;line-height:1.3;font-variant-numeric:tabular-nums}
.stat.score strong{color:var(--lime)}
.hint{position:absolute;top:92px;left:50%;transform:translateX(-50%);white-space:nowrap;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(4,20,34,.48);font-size:11px;color:#d5edf7;backdrop-filter:blur(8px)}
.bottom{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding:0 14px;display:flex;align-items:end;justify-content:space-between;gap:12px}
.joy{display:flex;gap:9px;pointer-events:auto}
.action{border:1px solid rgba(231,249,255,.3);color:#f2fbff;background:linear-gradient(160deg,rgba(26,73,94,.9),rgba(5,26,43,.92));box-shadow:0 8px 24px rgba(0,0,0,.24);border-radius:17px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;user-select:none;touch-action:manipulation}
.action:active,.action.active{transform:scale(.96);filter:brightness(1.25);border-color:var(--lime)}
.action small{font-size:9px;letter-spacing:.1em;color:#a7cbd9}
.steer{width:62px;height:58px;font-size:23px}
.movehint{font-size:9px;color:#a7c6d5;max-width:76px;line-height:1.35;padding:0 0 5px 2px}
.tricks{display:flex;gap:8px;pointer-events:auto}
.trick{width:76px;height:68px}
.trick.jump{border-color:rgba(214,255,112,.6);background:linear-gradient(160deg,rgba(69,91,48,.95),rgba(12,36,35,.96))}
.trick.turn{background:linear-gradient(160deg,rgba(26,88,114,.95),rgba(5,26,43,.96))}
.action .symbol{font-size:20px;line-height:1}
.message{position:absolute;top:36%;left:50%;transform:translate(-50%,-50%);text-align:center;width:min(90%,390px);text-shadow:0 3px 18px rgba(0,0,0,.6);transition:opacity .2s}
.message .eyebrow{font-size:10px;letter-spacing:.24em;color:var(--lime);font-weight:900}
.message h1{font-size:clamp(26px,7vw,42px);line-height:1.02;margin:8px 0 10px;font-weight:1000;letter-spacing:-.04em}
.message p{font-size:12px;line-height:1.65;color:#d4eaf4;margin:0 auto 17px;max-width:300px}
.primary{pointer-events:auto;border:0;border-radius:999px;background:var(--lime);color:#12251f;font-weight:1000;letter-spacing:.05em;padding:13px 24px;font-size:13px;box-shadow:0 8px 26px rgba(0,0,0,.24)}
.message.hidden{opacity:0;pointer-events:none}
.feedback{position:absolute;top:24%;left:50%;transform:translate(-50%,-50%);font-weight:1000;font-size:24px;letter-spacing:.05em;text-shadow:0 3px 16px #002033;opacity:0;transition:opacity .12s;white-space:nowrap}
.feedback.show{opacity:1}
.meterwrap{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 78px);transform:translateX(-50%);width:min(210px,52vw);pointer-events:none}
.meterlabel{font-size:8px;letter-spacing:.15em;font-weight:900;color:#c4e3ef;text-align:center;margin-bottom:4px}
.meter{height:5px;background:rgba(220,246,255,.2);border-radius:9px;overflow:hidden}
.meter>i{display:block;width:0%;height:100%;background:var(--lime);border-radius:9px;transition:width .12s}
.footerNote{position:absolute;left:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 91px);font-size:9px;color:rgba(213,237,248,.7);letter-spacing:.04em;pointer-events:none}
@media(min-width:700px){.topbar{padding:22px 24px}.bottom{padding:0 24px;bottom:22px}.hint{top:105px}.steer{width:72px;height:64px}.trick{width:92px;height:76px}.footerNote{left:24px;bottom:112px}.meterwrap{top:85px}}
</style>
</head>
<body>
<canvas id="game" aria-label="3D風サーフィンゲーム"></canvas>
<div class="overlay">
  <div class="topbar">
    <div class="brand">SHONAN / SURF RIDER<span>LINE &amp; FLOW · PROTOTYPE 02</span></div>
    <div class="stats">
      <div class="stat score"><small>SCORE</small><strong id="score">00000</strong></div>
      <div class="stat"><small>WAVE</small><strong id="wave">01</strong></div>
      <div class="stat"><small>FLOW</small><strong id="combo">x1</strong></div>
    </div>
  </div>
  <div class="hint" id="hint">波のフェイスを滑って、いい位置でターン！</div>
  <div class="meterwrap"><div class="meterlabel">WAVE POSITION</div><div class="meter"><i id="positionMeter"></i></div></div>
  <div class="feedback" id="feedback">GOOD TURN</div>
  <div class="message" id="message">
    <div class="eyebrow">READ THE WAVE</div>
    <h1>FIND YOUR<br>LINE.</h1>
    <p>波の斜面を左右に走り、波の力が集まる場所でターン。<br>リップ付近でジャンプを決めよう。</p>
    <button class="primary" id="start">RIDE THE WAVE →</button>
  </div>
  <div class="footerNote" id="footerNote">← → 波の斜面を移動　/　TURNで切り返し　/　AIRでジャンプ</div>
  <div class="bottom">
    <div class="joy">
      <div class="movehint">WAVE<br>CONTROL</div>
      <button class="action steer" id="left" aria-label="左へ移動">◀<small>LEFT</small></button>
      <button class="action steer" id="right" aria-label="右へ移動">▶<small>RIGHT</small></button>
    </div>
    <div class="tricks">
      <button class="action trick turn" id="turn"><span class="symbol">↶</span><small>TURN</small></button>
      <button class="action trick jump" id="jump"><span class="symbol">↑</span><small>AIR</small></button>
    </div>
  </div>
</div>
<script>
(() => {
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
let W=innerWidth,H=innerHeight,dpr=1;
let running=false,ended=false,last=0,time=0,score=0,combo=1,waveNo=1,feedbackTimer=0,feedbackText='';
let surfer={x:.52,depth:.72,lean:0,jump:0,vy:0,rot:0,pose:0};
let turnCooldown=0,airCooldown=0,turnCharge=0,airCharge=0,turnDir=1, wipeout=0, shake=0;
let wavePhase=0, speed=.22, waveQuality=.7, particles=[], trail=[];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function path(points){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));}
function fillPoly(points,fill){path(points);ctx.closePath();ctx.fillStyle=fill;ctx.fill()}
function strokePath(points,color,width=1){path(points);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function horizon(){return H*.30}
function waveSurfaceY(u,z){ // u across wave, z depth 0 horizon -> 1 foreground
 const hy=horizon(), perspective=Math.pow(z,1.6);
 const curl=Math.sin(u*5.2+wavePhase*1.15+z*1.8);
 const face=hy+perspective*H*.82;
 const shoulder=Math.sin(u*2.7+wavePhase*.45)*H*.045*z;
 return face+shoulder+curl*H*.045*z;
}
function waveX(u,z){return W*(.5+(u-.5)*(1.05+z*.45))}
function sky(){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#71c9e5');g.addColorStop(.35,'#c1e7ee');g.addColorStop(.55,'#f0e9d3');g.addColorStop(1,'#72c5ce');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // sun haze
 const rg=ctx.createRadialGradient(W*.76,H*.18,2,W*.76,H*.18,W*.45);rg.addColorStop(0,'rgba(255,246,202,.58)');rg.addColorStop(1,'rgba(255,246,202,0)');ctx.fillStyle=rg;ctx.fillRect(0,0,W,H*.65);
 // distant coast silhouette
 ctx.fillStyle='rgba(44,106,117,.45)';path([[0,H*.32],[0,H*.29],[W*.09,H*.27],[W*.17,H*.29],[W*.26,H*.26],[W*.34,H*.30],[W*.48,H*.28],[W*.61,H*.3],[W*.73,H*.27],[W*.83,H*.29],[W,H*.26],[W,H*.34]]);ctx.fill();
 // ocean distance
 const sea=ctx.createLinearGradient(0,H*.29,0,H*.53);sea.addColorStop(0,'#5fb9c8');sea.addColorStop(1,'#16758f');ctx.fillStyle=sea;ctx.fillRect(0,H*.30,W,H*.25);
 for(let i=0;i<7;i++){let y=H*(.315+i*.022);ctx.globalAlpha=.18+(i%3)*.04;strokePath([[0,y+Math.sin(wavePhase+i)*3],[W*.3,y-2],[W*.65,y+Math.cos(i+wavePhase)*2],[W,y-1]],'#e5fbf5',1)}ctx.globalAlpha=1;
}
function drawWave(){
 const rows=48,cols=48;
 // body mesh
 for(let r=rows-1;r>=0;r--){
  const z1=(r+1)/rows,z0=r/rows;
  const pts=[];
  for(let c=0;c<=cols;c++){let u=c/cols;pts.push([waveX(u,z1),waveSurfaceY(u,z1)])}
  for(let c=cols;c>=0;c--){let u=c/cols;pts.push([waveX(u,z0),waveSurfaceY(u,z0)])}
  let avg=(z0+z1)/2;
  const g=ctx.createLinearGradient(0,waveSurfaceY(.5,z0),0,waveSurfaceY(.5,z1));
  g.addColorStop(0,`hsl(${190+avg*8}, ${58+avg*13}%, ${48-avg*24}%)`);
  g.addColorStop(1,`hsl(${198+avg*7}, ${70+avg*10}%, ${38-avg*19}%)`);
  fillPoly(pts,g);
 }
 // long contour lines to show wave curvature / perspective
 for(let i=1;i<12;i++){
  const u=i/12,pts=[];
  for(let j=0;j<=34;j++){let z=j/34;pts.push([waveX(u+Math.sin(z*5+wavePhase)*.012,z),waveSurfaceY(u,z)-H*.004*z])}
  strokePath(pts,`rgba(204,250,246,${.07+i%3*.025})`,Math.max(.5,W/800));
 }
 // curling lip at left-to-right wave peak
 let lip=[];
 for(let i=0;i<=70;i++){let u=i/70;let crest=waveSurfaceY(u,.47)-H*(.085+.035*Math.sin(u*8+wavePhase));lip.push([waveX(u,.47),crest])}
 strokePath(lip,'rgba(215,255,250,.7)',Math.max(2,W*.003));
 strokePath(lip.map(p=>[p[0]+W*.004,p[1]+H*.012]),'rgba(17,105,133,.7)',Math.max(2,W*.006));
 // foam breaking edge rolling toward rider
 for(let i=0;i<90;i++){
  const u=(i/90+wavePhase*.018)%1,z=.5+Math.sin(u*8+wavePhase)*.045;
  const x=waveX(u,z),y=waveSurfaceY(u,z)-H*(.07+.025*Math.sin(u*9+wavePhase));
  const r=(1+z*4)*(W/390);
  ctx.fillStyle=`rgba(241,255,247,${.25+.3*Math.sin(i*4+wavePhase)})`;ctx.beginPath();ctx.ellipse(x,y,r*2,r*.45,Math.sin(u*8)*.15,0,Math.PI*2);ctx.fill();
 }
 // foam/spray at lower edge
 const z=.98;
 let edge=[];
 for(let i=0;i<=70;i++){let u=i/70;edge.push([waveX(u,z),waveSurfaceY(u,z)])}
 strokePath(edge,'rgba(220,255,251,.55)',H*.025);
 strokePath(edge,'rgba(249,255,244,.72)',H*.006);
}
function project(x,z,yoff=0){
 const px=W*(.5+(x-.5)*(1.0+z*.58));
 const py=horizon()+Math.pow(z,1.65)*H*.79+yoff;
 return [px,py];
}
function drawBoardAndRider(){
 let x=surfer.x,z=surfer.depth;
 let baseY=waveSurfaceY(x,z);
 let px=waveX(x,z),py=baseY-H*.018-surfer.jump*H*.17;
 const scale=(.28+z*.95)*(W/390);
 // shadow board on wave
 ctx.save();ctx.translate(px,baseY-H*.006);ctx.scale(scale,scale*.42);ctx.fillStyle='rgba(0,24,40,.26)';ctx.beginPath();ctx.ellipse(0,0,21,6,0,0,Math.PI*2);ctx.fill();ctx.restore();
 // board perspective, angle based on lean
 ctx.save();ctx.translate(px,py);ctx.rotate(surfer.rot+surfer.lean*.25);ctx.scale(scale,scale);
 // surfboard
 ctx.fillStyle='#f3f1d9';path([[-24,0],[-17,-3],[-4,-4],[13,-3],[23,0],[13,3],[-5,4],[-18,3]]);ctx.closePath();ctx.fill();
 ctx.strokeStyle='#ed8066';ctx.lineWidth=1.4;path([[-18,0],[19,0]]);ctx.stroke();
 // legs
 ctx.strokeStyle='#18364a';ctx.lineWidth=4;ctx.lineCap='round';
 path([[-4,-4],[-7,-13],[2,-18]]);ctx.stroke();path([[5,-3],[10,-11],[5,-17]]);ctx.stroke();
 // torso leaning
 ctx.strokeStyle='#f0bc91';ctx.lineWidth=5;path([[0,-17],[surfer.lean*5,-29],[surfer.lean*9,-35]]);ctx.stroke();
 // wetsuit body
 ctx.strokeStyle='#102f49';ctx.lineWidth=8;path([[0,-17],[surfer.lean*5,-29]]);ctx.stroke();
 // head
 ctx.fillStyle='#d9a17c';ctx.beginPath();ctx.arc(surfer.lean*9,-38,5,0,Math.PI*2);ctx.fill();
 // arms balancing
 ctx.strokeStyle='#f0bc91';ctx.lineWidth=3.5;
 path([[surfer.lean*3,-27],[-11-surfer.lean*3,-23]]);ctx.stroke();
 path([[surfer.lean*5,-28],[13+surfer.lean*4,-20]]);ctx.stroke();
 // splash when moving / jumping
 if(Math.abs(surfer.lean)>.3||surfer.jump>.05){
  for(let i=0;i<7;i++){let a=i*2.4+time*4;ctx.fillStyle=`rgba(230,255,250,${.35+Math.sin(a)*.25})`;ctx.beginPath();ctx.arc(-surfer.lean*12+Math.cos(a)*19,-3+Math.sin(a)*7,1.1+scale*.3,0,Math.PI*2);ctx.fill()}
 }
 ctx.restore();
 // board wake trail
 trail.push({x:px,y:baseY,z,life:1,lean:surfer.lean});if(trail.length>24)trail.shift();
 trail.forEach((p,i)=>{p.life-=.018;ctx.globalAlpha=Math.max(0,p.life)*.26;ctx.strokeStyle='#e8fffb';ctx.lineWidth=(i/24+1)*scale;ctx.beginPath();ctx.moveTo(p.x-p.lean*7,p.y);ctx.lineTo(p.x+p.lean*12,p.y+3+i*.4);ctx.stroke()});ctx.globalAlpha=1;trail=trail.filter(p=>p.life>0);
}
function drawParticles(dt){
 for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=18*dt;p.life-=dt;ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();if(p.life<=0)particles.splice(i,1)}
 ctx.globalAlpha=1;
}
function burst(x,y,n=20){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=20+Math.random()*150,life=.35+Math.random()*.6;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-35,life,max:life,r:1+Math.random()*3,color:Math.random()>.3?'#eafff7':'#9be4e8'})}}
function draw(){
 ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.88}
 sky();drawWave();
 // light glints in face
 for(let i=0;i<26;i++){let u=(i*0.173+wavePhase*.013)%1,z=.28+(i%8)*.085;let x=waveX(u,z),y=waveSurfaceY(u,z)+H*.018*z;ctx.globalAlpha=.07+(i%4)*.025;strokePath([[x,y],[x+W*(.012+z*.015),y-H*.002]],'#f2ffff',1+z*1.2)}ctx.globalAlpha=1;
 if(wipeout>0){
  const x=waveX(surfer.x,surfer.depth),y=waveSurfaceY(surfer.x,surfer.depth);
  ctx.fillStyle='rgba(244,255,250,.65)';for(let i=0;i<14;i++){let a=i*2.4+time*7;ctx.beginPath();ctx.arc(x+Math.cos(a)*H*.04,y+Math.sin(a)*H*.02,2+Math.sin(a)*2,0,Math.PI*2);ctx.fill()}
 }else drawBoardAndRider();
 drawParticles(1/60);
 // small lip target marker when in jump zone
 if(running&&surfer.x>.69&&surfer.x<.9&&surfer.depth>.55){
  let x=waveX(surfer.x,surfer.depth),y=waveSurfaceY(surfer.x,surfer.depth)-H*.09;
  ctx.globalAlpha=.6+.25*Math.sin(time*8);ctx.strokeStyle='#d8ff70';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,10+Math.sin(time*8)*2,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;
 }
 ctx.restore();
}
function ui(){ $('score').textContent=String(Math.floor(score)).padStart(5,'0');$('wave').textContent=String(waveNo).padStart(2,'0');$('combo').textContent='x'+combo;$('positionMeter').style.width=(surfer.x*100)+'%';}
function say(text,color='#d6ff70'){feedbackText=text;$('feedback').textContent=text;$('feedback').style.color=color;$('feedback').classList.add('show');feedbackTimer=1.0}
function start(){running=true;ended=false;time=0;score=0;combo=1;waveNo=1;surfer={x:.52,depth:.72,lean:0,jump:0,vy:0,rot:0,pose:0};turnCooldown=airCooldown=0;wipeout=0;trail=[];particles=[];$('message').classList.add('hidden');$('hint').textContent='フェイスを横切り、リップに近づいてAIR！';last=performance.now()}
function finish(){running=false;ended=true;$('message').classList.remove('hidden');$('message').innerHTML='<div class="eyebrow">SESSION COMPLETE</div><h1>'+Math.floor(score).toString().padStart(5,'0')+'<br>POINTS</h1><p>ラインを変えて、波の力を使おう。<br>TURNでスピードを作り、リップでAIR！</p><button class="primary" id="restart">RIDE AGAIN ↻</button>';$('restart').addEventListener('click',start,{once:true});}
function actTurn(){
 if(!running||wipeout>0||turnCooldown>0)return;
 turnCooldown=.55;
 const nearLip=surfer.x>.66&&surfer.x<.91;
 const goodDepth=surfer.depth>.58&&surfer.depth<.86;
 const speedOk=Math.abs(surfer.lean)>.16||Math.abs(surfer.x-.5)>.1;
 if(nearLip&&goodDepth&&speedOk){
  const points=150+Math.round(120*combo);score+=points;combo=Math.min(9,combo+1);say('CARVE! +'+points);burst(waveX(surfer.x,surfer.depth),waveSurfaceY(surfer.x,surfer.depth),12);surfer.rot+=turnDir*.45;surfer.lean=-surfer.lean*.65;surfer.x=clamp(surfer.x-turnDir*.11,.08,.94);speed=.28;
 }else if(surfer.x<.22||surfer.x>.94||surfer.depth<.35){
  say('OUT OF POSITION','#ffad8f');combo=1;surfer.lean*=.5;
 }else{
  score+=20;say('SMALL TURN +20','#b9e9f7');surfer.rot+=turnDir*.2;surfer.lean=-surfer.lean*.5;surfer.x=clamp(surfer.x-turnDir*.055,.08,.94);speed=.21;
 }
 turnDir*=-1;ui();
}
function actJump(){
 if(!running||wipeout>0||airCooldown>0||surfer.jump>.02)return;
 airCooldown=.85;
 const lipZone=surfer.x>.69&&surfer.x<.9&&surfer.depth>.58&&surfer.depth<.86;
 const moving=Math.abs(surfer.lean)>.18||Math.abs(surfer.x-.5)>.17;
 if(lipZone&&moving){
  surfer.vy=1.25;surfer.jump=.01;surfer.pose=1;surfer.rot=0;surfer.airGood=true;surfer.airTimer=0;combo=Math.min(9,combo+1);say('POP UP!');burst(waveX(surfer.x,surfer.depth),waveSurfaceY(surfer.x,surfer.depth)-20,15);
 }else{
  surfer.vy=.75;surfer.jump=.01;surfer.pose=1;surfer.airGood=false;surfer.airTimer=0;say('NO LIP = LOW AIR','#ffbc9f');
 }
}
function wipe(){wipeout=.9;combo=1;shake=12;surfer.jump=0;surfer.vy=0;score=Math.max(0,score-80);say('WIPEOUT  −80','#ff947d');burst(waveX(surfer.x,surfer.depth),waveSurfaceY(surfer.x,surfer.depth),32)}
function update(dt){
 if(!running)return;
 time+=dt;wavePhase+=dt*1.5;turnCooldown=Math.max(0,turnCooldown-dt);airCooldown=Math.max(0,airCooldown-dt);
 // current pushes rider gradually along face; horizontal movement changes line
 surfer.x+=surfer.lean*dt*.15;
 surfer.x=clamp(surfer.x,.07,.96);
 surfer.lean*=Math.pow(.35,dt);
 // keep moving forward, small depth movement on wave
 surfer.depth=.70+Math.sin(time*.75)*.07;
 if(wipeout>0){wipeout-=dt;if(wipeout<=0){surfer.x=.5;surfer.depth=.72;surfer.lean=0;surfer.rot=0;say('BACK ON THE BOARD');}}
 if(surfer.jump>0){
  surfer.airTimer+=dt;surfer.vy-=2.25*dt;surfer.jump+=surfer.vy*dt;
  if(surfer.jump<=0){surfer.jump=0;surfer.vy=0;
   if(surfer.airGood&&surfer.airTimer>.28&&surfer.airTimer<1.05){let pts=350+combo*90;score+=pts;say('CLEAN LANDING +'+pts);burst(waveX(surfer.x,surfer.depth),waveSurfaceY(surfer.x,surfer.depth),24);combo=Math.min(9,combo+1);speed=.3}
   else if(!surfer.airGood){score=Math.max(0,score-30);say('FLAT LANDING −30','#ffbc9f');combo=1}
   else{wipe()}
   surfer.airGood=false;surfer.pose=0;
  }
 }
 // natural drift and wave positioning danger
 if(!wipeout){
  score+=dt*(2+Math.abs(surfer.lean)*4);
  if(surfer.x<.1||surfer.x>.94){if(Math.random()<dt*.7)wipe()}
 }
 if(time>45){waveNo++;time=0;surfer.x=.5;say('NEW SET · WAVE '+waveNo);if(waveNo>=4)finish()}
 if(feedbackTimer>0){feedbackTimer-=dt;if(feedbackTimer<=0)$('feedback').classList.remove('show')}
 ui();
}
function frame(now){let dt=Math.min(.035,(now-(last||now))/1000||0);last=now;update(dt);draw();requestAnimationFrame(frame)}
function pressMove(dir,down){const b=$(dir<0?'left':'right');if(down){b.classList.add('active');surfer.lean=dir*.95;turnDir=dir;}else{b.classList.remove('active');if(Math.sign(surfer.lean)===dir)surfer.lean=dir*.35}}
function bindHold(id,dir){const el=$(id);const down=e=>{e.preventDefault();if(!running)return;pressMove(dir,true)};const up=e=>{e.preventDefault();pressMove(dir,false)};el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('pointerleave',up)}
bindHold('left',-1);bindHold('right',1);
$('turn').addEventListener('pointerdown',e=>{e.preventDefault();$('turn').classList.add('active');actTurn()});['pointerup','pointercancel','pointerleave'].forEach(ev=>$('turn').addEventListener(ev,()=> $('turn').classList.remove('active')));
$('jump').addEventListener('pointerdown',e=>{e.preventDefault();$('jump').classList.add('active');actJump()});['pointerup','pointercancel','pointerleave'].forEach(ev=>$('jump').addEventListener(ev,()=> $('jump').classList.remove('active')));
$('start').addEventListener('click',start);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')pressMove(-1,true);if(e.key==='ArrowRight'||e.key==='d')pressMove(1,true);if(e.key===' '||e.key==='ArrowUp')actJump();if(e.key==='Shift'||e.key==='Enter')actTurn()});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')pressMove(-1,false);if(e.key==='ArrowRight'||e.key==='d')pressMove(1,false)});
requestAnimationFrame(frame);
})();
</script>
